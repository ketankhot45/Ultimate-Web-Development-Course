<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .container {
            background-color: red;
            margin: 10px;
            border: solid;
        }

        .box {
            height: 45px;
            width: 45px;
            margin: 3px;
            background-color: green;
            transition: width 0.3s ease 2s;
            /* inspect and change element width to see */       
        }

        .item{
            height: 50px;
            width: 50vw;
            margin: 10px;
            border: 2px solid ;
            background-color: aqua;
            animation: kk-moving 4s ease 0.2s 2 normal;
        }
        @keyframes kk-moving {
            from{
                width: 45px;
            }
            to{
                width: 80vw;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" style="width: 60vh;">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
        <div class="box">Box 5</div>
    </div>

    <div class="container">
        <div class="item">Items</div>
        <div class="item">Items</div>
        <div class="item">Items</div>
        <div class="item">Items</div>
    </div>
</body>

</html>
