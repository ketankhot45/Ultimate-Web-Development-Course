<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Display Property Demo</title>
  <style>
    .box {
      background: lightblue;
      padding: 10px;
      margin: 5px;
      border: 1px solid #333;
    }

    .block {
      display: block;
      width: 200px;
    }

    .inline {
      display: inline;
      width: 200px; /* ignored for inline */
    }

    .inline-block {
      display: inline-block;
      width: 150px;
      height: 40px;
    }

    .none {
      display: none;
    }

    .flex-container {
      display: flex;
      gap: 10px;
      background: #eee;
      padding: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #eee;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h2>Block</h2>
  <div class="box block">Block element 1</div>
  <div class="box block">Block element 2</div>

  <h2>Inline</h2>
  <span class="box inline">Inline element 1</span>
  <span class="box inline">Inline element 2</span>

  <h2>Inline-block</h2>
  <div class="box inline-block">Inline-block 1</div>
  <div class="box inline-block">Inline-block 2</div>

  <h2>None (hidden)</h2>
  <div class="box none">You won’t see me!</div>

  <h2>Flex</h2>
  <div class="flex-container">
    <div class="box">Flex Item 1</div>
    <div class="box">Flex Item 2</div>
    <div class="box">Flex Item 3</div>
  </div>

  <h2>Grid</h2>
  <div class="grid-container">
    <div class="box">Grid Item A</div>
    <div class="box">Grid Item B</div>
    <div class="box">Grid Item C</div>
    <div class="box">Grid Item D</div>
  </div>
</body>
</html>
