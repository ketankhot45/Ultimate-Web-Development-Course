<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M and P</title>
<head>
  <style>
    .container {
      background-color: lightblue;
      padding: 20px; /* padding adds space inside the container */
    }

    .box1 {
      background-color: lightgreen;
      margin-bottom: 30px; /* margin below this box */
    }

    .box2 {
      background-color: lightcoral;
      margin-top: 50px; /* margin above this box */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box1">Box 1 (margin-bottom: 30px)</div>
    <div class="box2">Box 2 (margin-top: 50px)</div>
    <p> the space between Box 1 and Box 2 is 50px, not 80px.</p>
  </div>
</body>
</html>
