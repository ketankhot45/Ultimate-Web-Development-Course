<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            border: 2px solid red;
            display: grid;
            grid-template-columns: 200px 1fr 2fr;
            grid-template-rows: 1fr 2fr;
            /* grid-template-columns: repeat(6, 1fr); */
            gap: 5px;    /* shorthand for row-gap and column-gap */
            /* grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); */

        }

        

        .box{
            border: 2px solid;
            background-color: aqua;

        }

        #item {
             /* grid-column: 1 / 3; 
             grid-row: 1 / 3; */
            background-color: aquamarine;
             /* grid-column: span 2; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="item">This is a Box 1</div>
        <div class="box">This is a Box 2</div>
        <div class="box">This is a Box 3</div>
        <div class="box">This is a Box 4</div>
        <div class="box">This is a Box 5</div>
        <div class="box">This is a Box 6</div>
    </div>
</body>
</html>
