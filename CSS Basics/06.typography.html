<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
<style>

body{
  font-family: Arial;
}

/* Font size */
.sizeText{
  font-size: 24px;
}

/* Font weight */
.boldText{
  font-weight: bold;
}

/* Font style */
.italicText{
  font-style: italic;
}

/* Text color */
.colorText{
  color: blue;
}

/* Text alignment */
.centerText{
  text-align: center;
}

/* Text decoration */
.underlineText{
  text-decoration: underline;
}

/* Letter spacing and word spacing can also done*/
.letterSpace{
  letter-spacing: 4px;
}

/* Line height */   
.lineHeight{
  line-height: 3;
}

/* Text transform */
.uppercaseText{
  text-transform: uppercase;
}

</style>
</head>

<body>

<h2 class="sizeText">Large Text (font-size)</h2>

<p class="boldText">Bold Text (font-weight)</p>

<p class="italicText">Italic Text (font-style)</p>

<p class="colorText">Blue Color Text</p>

<p class="centerText">Centered Text</p>

<p class="underlineText">Underlined Text</p>

<p class="letterSpace">Spaced Letters</p>

<p class="lineHeight">
This is line one<br>
This is line two
</p>

<p class="uppercaseText">this text becomes uppercase</p>

</body>
</html>
