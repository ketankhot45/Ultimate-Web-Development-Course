<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
</head>

<body>
    <h1>Lists</h1>
    <ul> <!-- Unordered List(non numbered) -->
        <li>Apple</li>
        <li>Samsung</li>
        <li>Motorola</li>
        <li>Vivo</li>
    </ul>

    <ol> <!-- ordered List(numbered) -->
        <li>Apple</li>
        <li>Samsung</li>
        <li>Motorola</li>
        <li>Vivo</li>
    </ol>


    <dl> <!-- Description list -->
        <dt>HTML</dt>
        <dd>A markup language for creating web pages.</dd>

        <dt>CSS</dt>
        <dd>Used for styling HTML pages.</dd>
    </dl>

    <ul> <!-- Nesting Lists -->
        <li>Fruits
            <ul>
                <li>Apple</li>
                <li>Mango</li>
            </ul>
        </li>
        <li>Vegetables</li>
        
    </ul>
</body>

</html>
