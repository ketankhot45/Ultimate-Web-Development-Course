<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

<body>
    <table border="1">
        <tr>
            <td>S.no</td>
            <td>Items</td>
            <td>Prize</td>
        </tr>
        <tr>
            <td>1</td>
            <td>Apple</td>
            <td>100 rs</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Orange</td>
            <td>200 rs</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Pinaple</td>
            <td>50 rs</td>
        </tr>
        <tr>
            <th colspan="2">Total</th>
            <th>350rs</th>
        </tr>

    </table>
<br>
    <table border="1">
        <tr>
            <td rowspan="2">John</td>
            <td>Manager</td>
        </tr>
        <tr>
            <td>IT Department</td>
        </tr>
    </table>
</body>

</html>
