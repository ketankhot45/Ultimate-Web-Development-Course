<!DOCTYPE html>
<html>

<head>
    <title>Attributes and Classes</title>

    <style>
        .highlight {
            background-color: yellow;
            color: red;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h2 id="title">Working with Attributes & Classes</h2>

    <p id="para">This is a paragraph.</p>

    <img id="img" src="https://images.pexels.com/photos/20063016/pexels-photo-20063016.jpeg" width="500px"
        height="500px" alt="Sample Image">

    <br><br>

    <button onclick="changeAttributes()">Change Attribute</button>

    <button onclick="addClass()">Add Class</button>
    <button onclick="removeClass()">Remove Class</button>
    <button id="btn" onclick="toggleClass()">Toggle Class</button>

    <script>

        function changeAttributes() {

            let image = document.getElementById("img");

            // get attribute
            console.log(image.getAttribute("src"));

            // set attribute
            image.setAttribute("src", "https://images.pexels.com/photos/36399659/pexels-photo-36399659.jpeg");

            // remove attribute
            image.removeAttribute("alt");
        }

        function addClass() {
            document.getElementById("para").classList.add("highlight");
        }

        function removeClass() {
            document.getElementById("para").classList.remove("highlight");
        }

        function toggleClass() {
            document.getElementById("para").classList.toggle("highlight");  //add and remove both can be done by pressing same button

            if (para.classList.contains("highlight")) {
                document.getElementById("btn").innerText = "UnChange"
            }
            else {
                document.getElementById("btn").innerText = "Change"
            }
        }

    </script>

</body>

</html>
