<!DOCTYPE html>
<html>
<head>
<title>JavaScript Operators</title>
</head>
<body>

<h2>Open Console to See Operator Results</h2>

<script>

let a = 10;
let b = 5;

// ---------- 1. ARITHMETIC ----------
console.log("Arithmetic:");
console.log(a + b); // Addition
console.log(a - b); // Subtraction
console.log(a * b); // Multiplication
console.log(a / b); // Division
console.log(a % b); // Modulus
console.log(a ** b); // Power


// ---------- 2. ASSIGNMENT ----------
let x = 10;
x += 5;  // x = x + 5
console.log("Assignment:", x);


// ---------- 3. COMPARISON ----------
console.log("Comparison:");
console.log(a == b);   // equal
console.log(a === b);  // strict equal
console.log(a > b);
console.log(a < b);


// ---------- 4. LOGICAL ----------
console.log("Logical:");
console.log(a > 5 && b < 10); // AND
console.log(a < 5 || b < 10); // OR
console.log(!(a > b));        // NOT


// ---------- 5. INCREMENT / DECREMENT ----------
let n = 3;
console.log(n++); // post increment 
console.log(++n); // pre increment


// ---------- 6. TYPE OPERATOR ----------
console.log(typeof a); // number


// ---------- 7. TERNARY OPERATOR ----------
let result = (a > b) ? "A is bigger" : "B is bigger";
console.log(result);

</script>

</body>
</html>
